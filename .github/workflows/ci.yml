# CI on every PR and push to main. CD: a green main is pushed to branch `live`;
# valencia pulls `live` every minute (deploy/), then `verify` checks the public site serves it.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: JS syntax
        run: for f in js/*.js; do node --check "$f" || exit 1; done

      - name: Python compiles
        run: python -m py_compile build.py scripts/*.py

      - name: Static checks
        run: python scripts/ci_check.py

      - name: Smoke test (serve.py, every asset loads)
        run: |
          python scripts/serve.py --port 8765 --bind 127.0.0.1 &
          for i in $(seq 20); do curl -sf -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          fail=0
          for p in "" $(grep -oE '(src|href)="(js|css|data)/[^"#?]+"' index.html | cut -d'"' -f2) \
                   $(find data -name '*.geojson' -o -name '*.json'); do
            code=$(curl -s --compressed -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765/$p")
            [ "$code" = 200 ] || { echo "::error::/$p -> $code"; fail=1; }
          done
          exit $fail

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move branch live to this commit
        run: git push --force origin HEAD:refs/heads/live

  verify:
    needs: release
    runs-on: ubuntu-latest
    env:
      SITE: https://dev.nsrddyn.com
    steps:
      - uses: actions/checkout@v4
      - name: Wait until the site serves this commit (valencia pulls every minute)
        run: |
          files="index.html $(ls js/*.js) css/style.css"
          for i in $(seq 30); do
            stale=0
            for f in $files; do
              [ "$(curl -s --compressed "$SITE/$f" | sha256sum)" = "$(sha256sum < "$f")" ] || { stale=1; break; }
            done
            [ $stale = 0 ] && { echo "live: $GITHUB_SHA"; exit 0; }
            sleep 20
          done
          echo "::error::$SITE still serves an older version after 10 min ($f differs)"; exit 1
